name: NYC Mobility CI/CD

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository formatting
        run: git diff --check

      - name: Check required folders
        run: |
          test -d docs
          test -d src
          test -d src/sql
          test -d tests
          test -d .github/workflows

      - name: Check SQL pipeline folders
        run: |
          test -d src/sql/00_setup
          test -d src/sql/01_bronze_ingest
          test -d src/sql/02_silver_clean
          test -d src/sql/03_gold_model
          test -d src/sql/04_data_quality
          test -d src/sql/05_analytics

      - name: Check test folders
        run: |
          test -d tests/01_source_checks
          test -d tests/02_clean_checks
          test -d tests/03_mart_checks
