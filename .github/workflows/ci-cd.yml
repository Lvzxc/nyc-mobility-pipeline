name: NYC Mobility CI/CD

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/ci-cd.yml"
      - ".gitignore"

  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/ci-cd.yml"
      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read

# PR runs are collapsed to the newest commit.
concurrency:
  group: nyc-mobility-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check whitespace errors
        run: git diff --check
